name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml: retrieval relies on pgvector >= 0.8.0.
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Includes `alembic check` (tests/test_migrations.py), so a model changed without a migration fails here.
      - name: Tests with branch coverage
        run: pytest -v --cov --cov-report=term-missing
