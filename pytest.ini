[pytest]
asyncio_mode = auto
# One event loop for the whole run: the app's async engine is a module-level global, and its
# pooled connections must not be reused from a loop that has since been closed.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
pythonpath = .
testpaths = tests
markers =
    db: needs PostgreSQL with pgvector (TEST_DATABASE_URL, or Docker for a throwaway container); deselect with -m "not db"
